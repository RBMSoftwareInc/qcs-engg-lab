<svg width="32" height="32" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F2937"/>
      <stop offset="100%" stop-color="#4B5563"/>
    </linearGradient>
  </defs>
  <!-- Outer ring - quantum field -->
  <circle cx="60" cy="60" r="50" stroke="url(#fg)" stroke-width="2" fill="none" opacity="0.35"/>
  <circle cx="60" cy="60" r="45" stroke="url(#fg)" stroke-width="1.5" fill="none" opacity="0.25"/>
  <!-- Central core -->
  <circle cx="60" cy="60" r="8" fill="url(#fg)"/>
  <circle cx="60" cy="60" r="4" fill="#F4C430" opacity="0.9"/>
  <!-- Orbital paths -->
  <ellipse cx="60" cy="60" rx="30" ry="15" stroke="url(#fg)" stroke-width="1" fill="none" opacity="0.2" transform="rotate(45 60 60)"/>
  <ellipse cx="60" cy="60" rx="30" ry="15" stroke="url(#fg)" stroke-width="1" fill="none" opacity="0.2" transform="rotate(-45 60 60)"/>
  <!-- Cardinal nodes -->
  <circle cx="85" cy="60" r="3" fill="url(#fg)" opacity="0.65"/>
  <circle cx="35" cy="60" r="3" fill="url(#fg)" opacity="0.65"/>
  <circle cx="60" cy="85" r="3" fill="url(#fg)" opacity="0.65"/>
  <circle cx="60" cy="35" r="3" fill="url(#fg)" opacity="0.65"/>
  <!-- Connection lines -->
  <line x1="60" y1="60" x2="85" y2="60" stroke="url(#fg)" stroke-width="1" opacity="0.25"/>
  <line x1="60" y1="60" x2="35" y2="60" stroke="url(#fg)" stroke-width="1" opacity="0.25"/>
  <line x1="60" y1="60" x2="60" y2="85" stroke="url(#fg)" stroke-width="1" opacity="0.25"/>
  <line x1="60" y1="60" x2="60" y2="35" stroke="url(#fg)" stroke-width="1" opacity="0.25"/>
</svg>
